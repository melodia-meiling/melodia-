<style>
  :root {
    --bg: #ffffff; --bg-subtle: #f6f7f9; --surface: #ffffff;
    --border: #ecedf1; --border-strong: #d8dae0;
    --text: #15161a; --text-2: #565a64; --text-3: #8b8f99;
    --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eef2ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 5vw; background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, #4f46e5, #a855f7); color: #fff; font-size: 15px;
  }
  .topbar a.back {
    color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px;
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border-strong);
  }
  .topbar a.back:hover { background: var(--accent-soft); }
  .hero { padding: 56px 5vw 30px; max-width: 1200px; margin: 0 auto; }
  .hero .kicker { color: var(--accent); font-weight: 700; font-size: 13px; letter-spacing: .12em; }
  .hero h1 { font-size: clamp(26px, 4vw, 40px); font-weight: 900; margin: 10px 0 12px; }
  .hero p { color: var(--text-2); max-width: 720px; }
  .hero .count { margin-top: 14px; font-size: 13px; color: var(--text-3); }
  .hero .count b { color: var(--accent); }
  .grid { columns: 4 240px; column-gap: 14px; padding: 10px 5vw 70px; max-width: 1400px; margin: 0 auto; }
  .ph {
    break-inside: avoid; margin: 0 0 14px; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--border); background: var(--bg-subtle); cursor: zoom-in;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .ph:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(21,22,26,.10); }
  .ph img { width: 100%; display: block; }
  .lb {
    position: fixed; inset: 0; z-index: 100; display: none;
    background: rgba(10,10,14,.92); align-items: center; justify-content: center;
  }
  .lb.open { display: flex; }
  .lb img { max-width: 92vw; max-height: 86vh; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .lb .nav, .lb .close {
    position: absolute; background: rgba(255,255,255,.12); color: #fff; border: none;
    width: 46px; height: 46px; border-radius: 50%; font-size: 20px; cursor: pointer;
    display: grid; place-items: center; user-select: none;
  }
  .lb .nav:hover, .lb .close:hover { background: rgba(255,255,255,.25); }
  .lb .prev { left: 3vw; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 3vw; top: 50%; transform: translateY(-50%); }
  .lb .close { top: 3vh; right: 3vw; }
  .lb .counter {
    position: absolute; bottom: 3.5vh; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.85); font-size: 13px; letter-spacing: .08em;
  }
  footer { text-align: center; color: var(--text-3); font-size: 13px; padding: 26px 0 40px; border-top: 1px solid var(--border); }
  footer a { color: var(--accent); text-decoration: none; font-weight: 600; }

<script>
  (function () {
    var figures = Array.prototype.slice.call(document.querySelectorAll('.ph'));
    var lb = document.getElementById('lb');
    var lbImg = document.getElementById('lbImg');
    var counter = document.getElementById('lbCounter');
    var cur = 0;

    function show(i) {
      cur = (i + figures.length) % figures.length;
      var img = figures[cur].querySelector('img');
      lbImg.src = img.getAttribute('src');
      lbImg.alt = img.alt;
      counter.textContent = (cur + 1) + ' / ' + figures.length;
    }
    function open(i) { show(i); lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden'; }
    function close() { lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; }

    figures.forEach(function (f) {
      f.addEventListener('click', function () { open(figures.indexOf(f)); });
    });
    document.getElementById('lbClose').addEventListener('click', close);
    document.getElementById('lbPrev').addEventListener('click', function (e) { e.stopPropagation(); show(cur - 1); });
    document.getElementById('lbNext').addEventListener('click', function (e) { e.stopPropagation(); show(cur + 1); });
    lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
    document.addEventListener('keydown', function (e) {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft') show(cur - 1);
      else if (e.key === 'ArrowRight') show(cur + 1);
    });
    var tx = null;
    lb.addEventListener('touchstart', function (e) { tx = e.changedTouches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', function (e) {
      if (tx === null) return;
      var dx = e.changedTouches[0].clientX - tx;
      if (dx > 50) show(cur - 1); else if (dx < -50) show(cur + 1);
      tx = null;
    }, { passive: true });
  })();
</script>
